<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MNL AEROSPACE | GALERIE OFFICIELLE</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #050505; color: #fff; }
  
  header { text-align: center; padding: 40px 20px; background: #000; border-bottom: 2px solid #D4AF37; }
  header h1 { font-size: 2.8rem; color: #D4AF37; letter-spacing: 4px; }
  header p { color: #aaa; }
  
  .secret-btn { position: fixed; top: 20px; right: 20px; background: #D4AF37; color: #000; border: none; padding: 10px 15px; font-weight: bold; cursor: pointer; z-index: 1000; border-radius: 5px; }
  
  .tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; padding: 20px; background: #0a0a0a; }
  .tab-btn { padding: 10px 20px; background: #111; border: 2px solid #D4AF37; color: #D4AF37; cursor: pointer; font-weight: bold; transition: 0.3s; }
  .tab-btn.active { background: #D4AF37; color: #000; }
  
  .gallery { display: none; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 30px; max-width: 1600px; margin: auto; }
  .gallery.active { display: grid; }
  
  .card { background: #0a0a0a; border: 1px solid #222; border-radius: 12px; overflow: hidden; transition: 0.3s; }
  .card:hover { border-color: #D4AF37; transform: translateY(-5px); }
  .card img { width: 100%; height: 220px; object-fit: cover; cursor: pointer; }
  .card-content { padding: 15px; }
  .card-content h3 { color: #D4AF37; margin-bottom: 5px; }
  .like-btn { background: #222; color: #aaa; border: none; padding: 8px 12px; width: 100%; cursor: pointer; margin-top: 10px; }
  .like-btn.liked { background: #D4AF37; color: #000; }
  
  .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 9999; justify-content: center; align-items: center; }
  .lightbox.active { display: flex; }
  .lightbox-content { max-width: 90%; max-height: 90%; background: #111; padding: 30px; border: 2px solid #D4AF37; border-radius: 15px; overflow-y: auto; }
  .lightbox-content img { width: 100%; max-height: 50vh; object-fit: contain; margin-bottom: 20px; }
  .close { position: absolute; top: 20px; right: 40px; font-size: 3rem; color: #D4AF37; cursor: pointer; }
  
  #secretModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; justify-content: center; align-items: center; }
  #secretModal input { padding: 10px; background: #222; border: 1px solid #D4AF37; color: #fff; }
  #secretModal button { padding: 10px 20px; background: #D4AF37; border: none; color: #000; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>MNL AEROSPACE</h1>
  <p>L'IMPOSSIBLE DEVIENT INGÉNIERIE</p>
</header>

<button class="secret-btn" onclick="askPassword()">MES FAVORIS ❤️</button>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('avion', this)">AVIONS A/X/C/H</button>
  <button class="tab-btn" onclick="showTab('drone', this)">DRONES D</button>
  <button class="tab-btn" onclick="showTab('moto', this)">MOTOS M</button>
  <button class="tab-btn" onclick="showTab('concept', this)">CONCEPTS</button>
</div>

<!-- AVIONS -->
<div id="avion" class="gallery active"></div>

<!-- DRONES -->
<div id="drone" class="gallery"></div>

<!-- MOTOS -->
<div id="moto" class="gallery"></div>

<!-- CONCEPTS -->
<div id="concept" class="gallery"></div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <span class="close">&times;</span>
  <div class="lightbox-content" onclick="event.stopPropagation()">
    <img id="lb-img">
    <h2 id="lb-title" style="color:#D4AF37;"></h2>
    <p><b>Mission:</b> <span id="lb-mission"></span></p>
    <p><b>Technologie:</b> <span id="lb-tech"></span></p>
    <p><b>Création:</b> <span id="lb-creation"></span></p>
  </div>
</div>

<!-- MODAL SECRET -->
<div id="secretModal">
  <div style="background:#111; padding:30px; border:2px solid #D4AF37;">
    <h3 style="color:#D4AF37;">ENTRER LE MOT DE PASSE MNL</h3>
    <input type="password" id="passwordInput" placeholder="Mot de passe">
    <button onclick="checkPassword()">ENTRER</button>
  </div>
</div>
