<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MNL INDUSTRIES — L'impossible devient ingénierie</title>
  <style>
    /* DESIGN HOLOGRAPHIQUE & FUTURISTE (Or pâle / Noir carbone) */
    :root {
      --gold-holo: #dfc374;
      --gold-glow: rgba(223, 195, 116, 0.25);
      --bg-dark: #030303;
      --card-bg: #0a0a0a;
      --border-holo: rgba(223, 195, 116, 0.35);
    }

    body {
      background-color: var(--bg-dark);
      color: var(--gold-holo);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      letter-spacing: 0.5px;
    }

    /* BARRE DE NAVIGATION IMMERSIVE */
    .navbar {
      background: rgba(3, 3, 3, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-holo);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 22px;
      font-weight: bold;
      color: var(--gold-holo);
      display: flex;
      align-items: center;
    }
    .m-logo {
      background: var(--gold-holo);
      color: #030303;
      padding: 3px 8px;
      margin-right: 8px;
      font-weight: 900;
    }
    .nav-links {
      list-style: none;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin: 0;
      padding: 0;
    }
    .nav-links a {
      color: var(--gold-holo);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.8rem;
      opacity: 0.85;
      transition: opacity 0.2s, text-shadow 0.2s;
    }
    .nav-links a:hover {
      opacity: 1;
      text-shadow: 0 0 10px var(--gold-holo);
    }

    /* SECTION ACCUEIL CAPTIVANTE (Style flux direct) */
    .hero {
      padding: 40px 20px 20px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border-holo);
      background: radial-gradient(circle at center, #111 0%, #030303 70%);
    }
    .hero h1 {
      font-size: 2.2rem;
      color: var(--gold-holo);
      margin: 0 0 10px 0;
      letter-spacing: 2px;
    }
    .signature {
      font-size: 0.95rem;
      color: var(--gold-holo);
      opacity: 0.9;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }
    .creator-tag {
      color: var(--gold-holo);
      font-size: 0.8rem;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* FLUX DE CONTENU STYLE "GOOGLE NEWS" SANS CADRES LOURDS */
    .machines {
      padding: 30px 15px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .machines h2 {
      color: var(--gold-holo);
      font-size: 1.4rem;
      margin-bottom: 20px;
      border-left: 3px solid var(--gold-holo);
      padding-left: 10px;
      letter-spacing: 1px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-holo);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 20px var(--gold-glow);
    }
    
    /* IMAGES FLUIDES SANS ENCADREMENT BLOQUANT */
    .card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      cursor: pointer;
      border-bottom: 1px solid var(--border-holo);
      transition: opacity 0.2s;
    }
    .card img:hover {
      opacity: 0.9;
    }

    .card-info {
      padding: 15px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card h3 {
      color: var(--gold-holo);
      margin: 0 0 5px 0;
      font-size: 1rem;
    }
    .card p {
      color: var(--gold-holo);
      font-size: 0.8rem;
      opacity: 0.7;
      margin: 0 0 12px 0;
    }
    
    /* INTERACTIONS (VOTES & COMMENTAIRES ÉPURÉS) */
    .interaction-box {
      border-top: 1px dashed rgba(223, 195, 116, 0.2);
      padding-top: 10px;
      margin-top: 10px;
    }
    .vote-buttons {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .vote-buttons button {
      background: transparent;
      color: var(--gold-holo);
      border: 1px solid var(--border-holo);
      padding: 4px 10px;
      cursor: pointer;
      font-size: 0.75rem;
      border-radius: 4px;
    }
    .vote-buttons button:hover {
      background: var(--gold-holo);
      color: #030303;
    }
    .comment-section input, .comment-section textarea {
      width: 100%;
      background: #030303;
      border: 1px solid var(--border-holo);
      color: var(--gold-holo);
      padding: 6px;
      margin-bottom: 5px;
      box-sizing: border-box;
      font-size: 0.75rem;
      border-radius: 3px;
    }
    .comment-section button {
      background: var(--gold-holo);
      color: #030303;
      border: none;
      padding: 5px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 0.75rem;
      border-radius: 3px;
    }
    .comment-list {
      max-height: 80px;
      overflow-y: auto;
      margin-top: 6px;
      font-size: 0.7rem;
      border-top: 1px dotted rgba(223, 195, 116, 0.2);
      padding-top: 4px;
    }
    .comment-item {
      margin-bottom: 3px;
      opacity: 0.85;
    }

    /* MODALE D'AGRANDISSEMENT */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(3, 3, 3, 0.95);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-holo);
      padding: 15px;
      max-width: 850px;
      width: 90%;
      text-align: center;
      position: relative;
      border-radius: 6px;
    }
    .modal-content img {
      width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border: 1px solid var(--border-holo);
    }
    .close-btn {
      position: absolute;
      top: 5px;
      right: 15px;
      color: var(--gold-holo);
      font-size: 30px;
      cursor: pointer;
      background: none;
      border: none;
    }

    footer {
      border-top: 1px solid var(--border-holo);
      text-align: center;
      padding: 25px;
      color: var(--gold-holo);
      font-size: 0.8rem;
      opacity: 0.7;
      margin-top: 40px;
    }
  </style>
</head>

    function renderDepot() {
      const containers = {
        aviation: document.getElementById('grid-aviation'),
        drones: document.getElementById('grid-drones'),
        automobiles: document.getElementById('grid-automobiles'),
        motos: document.getElementById('grid-motos'),
        archives: document.getElementById('grid-archives')
      };

      depotItems.forEach(item => {
        let likes = localStorage.getItem('likes_' + item.id) || 0;
        let dislikes = localStorage.getItem('dislikes_' + item.id) || 0;
        let comments = JSON.parse(localStorage.getItem('comments_' + item.id) || '[]');

        let commentsHTML = comments.map(c => `<div class="comment-item"><strong>${c.name}</strong>: ${c.text}</div>`).join('');

        let cardHTML = `
          <div class="card">
            <img src="${item.file}" alt="${item.name}" onclick="openModal('${item.name}', '${item.file}')">
            <div class="card-info">
              <div>
                <h3>${item.name}</h3>
                <p>${item.desc}</p>
              </div>
              <div class="interaction-box">
                <div class="vote-buttons">
                  <button onclick="vote('${item.id}', 'like')">👍 (<span id="l-${item.id}">${likes}</span>)</button>
                  <button onclick="vote('${item.id}', 'dislike')">👎 (<span id="d-${item.id}">${dislikes}</span>)</button>
                </div>
                <div class="comment-section">
                  <input type="text" id="c-name-${item.id}" placeholder="Votre nom">
                  <textarea id="c-text-${item.id}" placeholder="Votre avis..." rows="1"></textarea>
                  <button onclick="addComment('${item.id}')">PUBLIER</button>
                  <div class="comment-list" id="list-${item.id}">
                    ${commentsHTML}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        if (containers[item.cat]) {
          containers[item.cat].innerHTML += cardHTML;
        }
      });
    }

    function vote(id, type) {
      let votedKey = 'voted_' + id;
      if (localStorage.getItem(votedKey)) {
        alert("Déjà voté !");
        return;
      }
      let countElem = document.getElementById(type === 'like' ? 'l-' + id : 'd-' + id);
      let currentVal = parseInt(countElem.innerText) + 1;
      countElem.innerText = currentVal;
      localStorage.setItem(type === 'like' ? 'likes_' + id : 'dislikes_' + id, currentVal);
      localStorage.setItem(votedKey, 'true');
    }

    function addComment(id) {
      let nameInput = document.getElementById('c-name-' + id);
      let textInput = document.getElementById('c-text-' + id);
      let name = nameInput.value.trim();
      let text = textInput.value.trim();

      if (!name || !text) return;

      let commentsKey = 'comments_' + id;
      let comments = JSON.parse(localStorage.getItem(commentsKey) || '[]');
      comments.push({ name: name, text: text });
      localStorage.setItem(commentsKey, JSON.stringify(comments));

      let listElem = document.getElementById('list-' + id);
      listElem.innerHTML += `<div class="comment-item"><strong>${name}</strong>: ${text}</div>`;
      nameInput.value = '';
      textInput.value = '';
    }

    function openModal(title, file) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalImg').src = file;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    window.onload = renderDepot;
